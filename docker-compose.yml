services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bd_usuarios
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-net

  ms-usuarios:
    build: ./ms-usuarios/ms-usuarios
    container_name: ms-usuarios
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING.DATASOURCE.URL=jdbc:mysql://mysql-db:3306/bd_usuarios?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING.DATASOURCE.USERNAME=root
      - SPRING.DATASOURCE.PASSWORD=rootpassword
    depends_on:
      - mysql-db
    networks:
      - app-net

  ms-compras:
    build: ./ms-compras/ms-compras
    container_name: ms-compras
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING.DATASOURCE.URL=jdbc:mysql://mysql-db:3306/bd_compras?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING.DATASOURCE.USERNAME=root
      - SPRING.DATASOURCE.PASSWORD=rootpassword
    depends_on:
      - mysql-db
      - ms-usuarios
    networks:
      - app-net

volumes:
  mysql_data:

networks:
  app-net:
    driver: bridge